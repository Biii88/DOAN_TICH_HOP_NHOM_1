_format_version: "3.0"  # Dùng bản 3.0 cho ổn định với Kong hiện tại
_transform: true

services:
  # =========================
  # ORDER API SERVICE
  # =========================
  - name: order-service
    url: http://order-api:5678  # Theo log trước đó của bạn là cổng 5678
    routes:
      - name: order-route
        paths:
          - /orders

  # =========================
  # REPORT SERVICE
  # =========================
  - name: report-service
    url: http://report_service:8000
    routes:
      - name: report-route
        paths:
          - /api/report  # Sửa lại cho giống trong code Python của bạn
        strip_path: false # Giữ nguyên path để FastAPI nhận được đúng "/api/report"
# =========================
# PLUGINS & CONSUMERS
# =========================
# Lưu ý: Mình tạm để key-auth ở đây, bạn phải dùng ?apikey=noah-secret-key để vào nhé
plugins:
  - name: key-auth
    config:
      key_names: [apikey]
  - name: rate-limiting
    config:
      minute: 10
      policy: local

consumers:
  - username: client_app
    keyauth_credentials:
      - key: noah-secret-key