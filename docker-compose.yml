services:
  # Database MySQL cho Web Store
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webstore
    ports:
      - "3306:3306"
    networks:
      - noah-network

  # Database PostgreSQL cho Finance
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: finance
    ports:
      - "5432:5432"

  # Dịch vụ Report (Module 3)
  report_service:
    build: ./report_service
    ports:
      - "8001:8000"
    depends_on:
      - mysql-db
      - postgres

  # Dịch vụ Legacy Adapter
  legacy-adapter:
    build: ./legacy_adapter
    depends_on:
      - mysql-db
    networks:
      - noah-network

  # --- MODULE 4: KONG GATEWAY ---
  kong:
    image: kong:3.4
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks:
      - noah-network
    depends_on:
      - mysql-db

  # DỊCH VỤ GIẢ (MOCK SERVICES) - Đã sửa 'args' thành 'command'
  order-api:
    image: hashicorp/http-echo
    command: ["-text", '{"message": "Gateway connected to Order API!"}']
    networks:
      - noah-network

  report-service:
    image: hashicorp/http-echo
    command: ["-text", '{"message": "Gateway connected to Report Service!"}']
    networks:
      - noah-network

networks:
  noah-network:
    driver: bridge